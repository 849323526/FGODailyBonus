name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '32 20 * * *'

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        python-version: ['3.8']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify environment
        run: |
          python --version
          python -m pip show cryptography
          python -c "import cryptography; print('Cryptography:', cryptography.__version__); assert cryptography.__version__ == '42.0.8'"

      - name: Test
        run: python main.py
        env:
          userIds: ${{ secrets.GAME_USERIDS }}
          authKeys: ${{ secrets.GAME_AUTHKEYS }}
          secretKeys: ${{ secrets.GAME_SECRETKEYS }}
          verCode: ${{ secrets.GAME_VERCODE }}
          UserAgent: ${{ secrets.GAME_USERAGENT }}
          TGBotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TGAdminId: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GithubToken: ${{ secrets.VERY_IMPORTANT_TOKEN }}
          GithubName: ${{ secrets.VERY_IMPORTANT_NAME }}
